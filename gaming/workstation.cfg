// Personal baseline; no account data. Loaded by the CS2 launch wrapper.
fps_max "240"
fps_max_ui "60"
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_ping_show "2"
cl_hud_telemetry_net_misdelivery_show "2"
// Preserve sensitivity selected in the game's menu; do not reset it at launch.
cl_crosshairstyle "4"
cl_crosshaircolor "1"
cl_crosshairsize "2.5"
cl_crosshairthickness "0.5"
cl_crosshairgap "-2"
cl_crosshairdot "0"
cl_crosshair_drawoutline "1"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"
// Explicit CS2 default mouse axes; preserve the user's sensitivity.
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "e" "+use"
bind "b" "buymenu"
bind "TAB" "+showscores"
echo "Workstation CS2 baseline loaded"
