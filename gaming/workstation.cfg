// Personal baseline; no account data. Loaded by the CS2 launch wrapper.
// Allow future live profile changes with the default console key and exec.
con_enable "1"
fps_max "240"
fps_max_ui "60"
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_ping_show "2"
cl_hud_telemetry_net_misdelivery_show "2"
// Preserve sensitivity selected in the game's menu; do not reset it at launch.
// donk crosshair/radar values listed 2026-10-01:
// https://prosettings.net/players/donk/
// Keep this PC's 1080p resolution; use the listed 2px bars, not 4:3 stretching.
// Small static green cross; no outline, recoil-follow or center dot.
cl_crosshairstyle "4"
cl_crosshair_screen_height "1080"
cl_crosshair_length "2"
cl_crosshair_thickness "2"
cl_crosshair_gap "0"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshaircolor_a "255"
cl_crosshairdot "0"
cl_crosshair_t "0"
cl_crosshair_recoil "0"
cl_crosshair_drawoutline "0"
cl_crosshair_sniper_width "0"
cl_crosshairoutline_r "0"
cl_crosshairoutline_g "0"
cl_crosshairoutline_b "0"
cl_crosshairoutline_a "255"
// donk radar: player-centered, rotating, normal HUD size, zoom 0.7.
cl_radar_scale "0.7"
cl_radar_always_centered "1"
cl_radar_rotate "1"
cl_radar_scale_dynamic "0"
cl_hud_radar_scale "1"
cl_radar_icon_scale_min "0.7"
cl_radar_square_with_scoreboard "1"
// Weapon model only: does not change world FOV or aiming sensitivity.
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"
r_player_visibility_mode "1"
// Competitive music channels. Preserve effects, voice, master volume and EQ.
snd_deathcamera_volume "0"
snd_mvp_volume "0"
snd_roundend_volume "0"
snd_mute_mvp_music_live_players "1"
// Keep the existing audible warning level; do not mute this channel.
snd_tensecondwarning_volume "0.04"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"
// Explicit CS2 default mouse axes; preserve the user's sensitivity.
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "e" "+use"
bind "b" "buymenu"
bind "TAB" "+showscores"
echo "Workstation CS2 baseline loaded"
